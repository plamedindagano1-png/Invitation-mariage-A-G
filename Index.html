<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#b5573a">
<title>Invitation de mariage</title>
<meta property="og:title" content="Vous êtes invités à notre mariage">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:ital,wght@0,400;0,500;1,400&family=Cinzel:wght@400;500&family=Jost:wght@300;400;500&family=Pinyon+Script&display=swap" rel="stylesheet">
<style>
:root{--c:#f6efe4;--t:#b5573a;--t2:#97442a;--b:#17110e;--b2:#5c4c42}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth;-webkit-text-size-adjust:100%}
body{background:var(--c);color:var(--b);font:300 17px/1.7 Jost,sans-serif;-webkit-font-smoothing:antialiased;overflow-x:hidden}
body.lock{overflow:hidden;height:100svh}
a:focus-visible,button:focus-visible{outline:2px solid var(--t);outline-offset:3px}
.kick{font:500 12px/1.4 Cinzel,serif;letter-spacing:.32em;text-transform:uppercase;color:var(--t)}
h2{font:400 clamp(30px,8.5vw,44px)/1.15 'Bodoni Moda',serif;margin:12px 0 38px}
section{padding:96px 24px;text-align:center}
.ct{max-width:600px;margin:auto}
.w{display:inline-block;opacity:0;transform:translateY(.45em);transition:opacity 1.4s ease,transform 1.4s ease;transition-delay:calc(var(--i)*.16s)}
.in .w{opacity:1;transform:none}
.rv{opacity:0;transform:translateY(26px);transition:opacity 1.5s ease,transform 1.5s ease}
.rv.in{opacity:1;transform:none}
.btn{display:inline-block;margin-top:30px;padding:16px 32px;background:var(--t);color:#fff;font:500 12px Cinzel,serif;letter-spacing:.24em;text-transform:uppercase;text-decoration:none;border:0;border-radius:2px;cursor:pointer;transition:background .8s}
.btn:hover{background:var(--t2)}

/* Enveloppe */
#ouv{position:fixed;inset:0;z-index:50;background:radial-gradient(circle at 50% 38%,#f3e8d6,#d9c7ad);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:56px;transition:opacity 1.8s ease,visibility 1.8s}
#ouv.end{opacity:0;visibility:hidden;pointer-events:none}
.env{--w:min(84vw,360px);width:var(--w);height:calc(var(--w)*.68);position:relative;perspective:900px;filter:drop-shadow(0 22px 28px rgba(59,35,24,.32));margin-top:18vh}
.env>*{position:absolute}
.bk{inset:0;background:var(--t2);border-radius:4px}
.cd{left:7%;right:7%;top:6%;height:88%;background:#fffaf1;border:1px solid #e6d6bf;z-index:2;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;text-align:center;transition:transform 1.5s cubic-bezier(.5,0,.2,1) .9s}
.cd small{font:500 10px/1.5 Cinzel,serif;letter-spacing:.2em;color:var(--t);text-transform:uppercase;padding:0 10px;margin-bottom:4px}
.cd b{font:400 clamp(26px,9vw,36px)/1.1 'Pinyon Script',cursive;color:var(--b)}
.cd span{font:400 12px 'Bodoni Moda',serif;color:var(--b2);margin-top:6px}
.fr{inset:0;background:var(--t);clip-path:polygon(0 0,50% 54%,100% 0,100% 100%,0 100%);z-index:3;border-radius:4px}
.fl{left:0;top:0;width:100%;height:54%;background:#a34c30;clip-path:polygon(0 0,100% 0,50% 100%);transform-origin:top;z-index:4;transition:transform 1.1s ease-in-out,z-index 0s .5s}
.sl{left:50%;top:54%;width:62px;height:62px;margin:-31px 0 0 -31px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#a8402a,#6a2113 72%);box-shadow:0 3px 8px rgba(0,0,0,.4),inset 0 0 0 4px rgba(255,255,255,.07);color:#f1d9c6;font:500 14px Cinzel,serif;display:grid;place-items:center;z-index:5;transition:opacity .6s,transform .7s}
.open .fl{transform:rotateX(180deg);z-index:1}
.open .cd{transform:translateY(-60%)}
.open .sl{opacity:0;transform:scale(.6)}
#go{font:500 12px Cinzel,serif;letter-spacing:.24em;text-transform:uppercase;color:var(--c);background:var(--b);border:0;padding:17px 30px;border-radius:2px;cursor:pointer;transition:opacity .6s}
.open #go{opacity:0;pointer-events:none}

/* Accueil */
.hero{position:relative;min-height:100svh;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;text-align:center;color:var(--c);padding:80px 20px 36px;background:var(--b);overflow:hidden}
.hero .bg{position:absolute;inset:0;background-size:cover;background-position:50% 22%;animation:zoom 26s ease-out forwards}
.hero:before{content:"";position:absolute;inset:0;background:linear-gradient(rgba(23,17,14,.3),rgba(23,17,14,0) 32%,rgba(23,17,14,.55) 68%,#17110e);z-index:1}
.hero>:not(.bg){position:relative;z-index:2}
@keyframes zoom{from{transform:scale(1.12)}to{transform:scale(1)}}
.hero .kick{color:#f0d6c4}
.names{font:400 clamp(60px,19vw,112px)/.95 'Pinyon Script',cursive;margin:20px 0 8px;text-shadow:0 2px 24px rgba(0,0,0,.35)}
.names span,.names i{display:block}
.names i{font-size:.5em;font-style:normal;margin:4px 0}
.date{font:400 italic clamp(19px,5.5vw,24px) 'Bodoni Moda',serif}
.intro{background:#17110e;color:var(--c);text-align:center;padding:8px 22px 84px}
.wel{max-width:460px;margin:0 auto 36px;font-size:17px;line-height:1.85;color:#f3e6d6}
.cdn{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;width:100%;max-width:380px;margin:auto}
.cdn div{border:1px solid rgba(246,239,228,.45);padding:12px 0 9px;border-radius:2px;backdrop-filter:blur(4px);background:rgba(59,35,24,.2)}
.cdn b{display:block;font:400 28px/1.1 'Bodoni Moda',serif}
.cdn small{font:400 9px Cinzel,serif;letter-spacing:.14em;text-transform:uppercase}

/* Histoire */
.tl{position:relative;text-align:left;padding-left:44px;--p:0}
.tl:before,.tl:after{content:"";position:absolute;left:11px;top:6px;bottom:6px;width:1px;background:rgba(181,87,58,.22)}
.tl:after{background:var(--t);transform-origin:top;transform:scaleY(var(--p))}
.tl article{position:relative;margin-bottom:52px}
.tl article:last-child{margin-bottom:0}
.tl article:before{content:"";position:absolute;left:-39px;top:7px;width:11px;height:11px;border-radius:50%;border:1px solid var(--t);background:var(--c);transition:background 1.2s}
.tl article.in:before{background:var(--t)}
.tl h3{font:400 24px/1.25 'Bodoni Moda',serif;margin:2px 0 6px}
.tl p{color:var(--b2);font-size:16px}

/* Galerie */
#galerie{background:#ecdfcc;padding-left:20px;padding-right:20px}
.gal{display:grid;gap:22px}
.ph{position:relative;height:min(66svh,520px);overflow:hidden;border-radius:2px}
.ph:nth-child(odd){border-radius:999px 999px 2px 2px}
.ph img{position:absolute;left:0;top:-12%;width:100%;height:124%;object-fit:cover;will-change:transform}

/* Programme */
.pg{display:grid;grid-template-columns:112px 1fr;align-items:baseline;text-align:left;padding:20px 0;border-bottom:1px solid rgba(59,35,24,.14)}
.day{margin:44px 0 10px;text-align:left}.day:first-of-type{margin-top:0}.day+.pg{border-top:1px solid rgba(23,17,14,.14)}
.pg b{font:500 13px Cinzel,serif;color:var(--t);letter-spacing:.08em}
.pg span{font:400 19px 'Bodoni Moda',serif}

/* Lieu */
.lieu h3{font:400 26px 'Bodoni Moda',serif}
.lieu p{color:var(--b2);margin-bottom:24px}
iframe{width:100%;height:280px;border:0;border-radius:2px;filter:sepia(.35) saturate(.85)}

/* Tenue */
#tenue{background:#ecdfcc}
.sws{display:flex;justify-content:center;gap:26px;margin-top:34px}
.sw{font:400 11px Cinzel,serif;letter-spacing:.12em;text-transform:uppercase}
.sw i{display:block;width:64px;height:64px;border-radius:50%;margin:0 auto 10px;border:1px solid rgba(59,35,24,.25)}

/* RSVP + pied */
#rsvp{background:var(--b);color:var(--c)}
#rsvp .kick{color:#f6d9c8}
#rsvp .btn{background:var(--c);color:var(--b)}
#rsvp .btn:hover{background:#fff}
#rsvp small{display:block;margin-top:22px;font:400 italic 17px 'Bodoni Moda',serif}
footer{background:#0d0a08;border-top:1px solid rgba(246,239,228,.12);color:var(--c);text-align:center;padding:84px 24px calc(60px + env(safe-area-inset-bottom))}
footer p{font:400 italic 20px 'Bodoni Moda',serif}
footer .ini{font:400 64px/1.2 'Pinyon Script',cursive;margin:14px 0 6px;color:#e6b79f}
footer .nb{max-width:420px;margin:26px auto 0;font:300 italic 16px/1.7 'Bodoni Moda',serif;color:#d8bfae}
footer small{display:block;margin-top:26px;font:400 12px Cinzel,serif;letter-spacing:.26em;color:#d8bfae}

@media(prefers-reduced-motion:reduce){
*,*:before,*:after{animation:none!important;transition:none!important}
.rv,.w{opacity:1!important;transform:none!important}
html{scroll-behavior:auto}}
</style>
</head>
<body class="lock">

<div id="ouv">
  <div class="env">
    <div class="bk"></div>
    <div class="cd"><small>Bienvenu à notre union</small><b id="cdn"></b><span id="cdd"></span></div>
    <div class="fr"></div>
    <div class="fl"></div>
    <div class="sl" id="sli"></div>
  </div>
  <button id="go" type="button">Ouvrir notre invitation</button>
</div>

<main id="site"></main>

  <h1 class="names t"><span>${W(N.p1)}</span><i>&amp;</i><span>${W(N.p2,2)}</span></h1>
  <p class="date rv">${N.dateTxt}</p>
</header>
<div class="intro">
  <p class="wel rv">${N.accueil}</p>
  <div class="cdn rv" aria-label="Compte à rebours">
    ${["jours","heures","minutes","secondes"].map((l,i)=>`<div><b id="c${i}">0</b><small>${l}</small></div>`).join("")}
  </div>
</div>

${S("histoire",H("Notre histoire","Trois moments qui nous ont menés jusqu’à vous")+
 `<div class="tl">${N.histoire.map(e=>`<article class="rv"><p class="kick">${e[0]}</p><h3>${e[1]}</h3><p>${e[2]}</p></article>`).join("")}</div>`)}

${S("galerie",H("Galerie","Quelques souvenirs")+
 `<div class="gal">${N.galerie.map((s,i)=>`<div class="ph rv"><img src="${s}" alt="Photo ${i+1} des mariés" loading="lazy"></div>`).join("")}</div>`)}

${S("programme",H("Le programme","Le déroulé de nos deux jours")+
 N.programme.map(j=>`<h3 class="day kick rv">${j[0]}</h3>`+j[1].map(p=>`<div class="pg rv"><b>${p[0]}</b><span>${p[1]}</span></div>`).join("")).join(""))}

${S("lieu",H("Le lieu","Où nous retrouver")+
 `<div class="lieu rv"><h3>${N.salle}</h3><p>${lieuTxt}</p>
  <iframe title="Carte du lieu" loading="lazy" referrerpolicy="no-referrer-when-downgrade" src="https://www.google.com/maps?q=${q}&output=embed"></iframe>
  <a class="btn" target="_blank" rel="noopener" href="https://www.google.com/maps/dir/?api=1&destination=${q}">Ouvrir l’itinéraire</a></div>`)}

${S("tenue",H("Tenue","Le code vestimentaire")+
 `<p class="rv">${N.tenue}</p><div class="sws rv">${N.couleurs.map(c=>`<div class="sw"><i style="background:${c[1]}"></i>${c[0]}</div>`).join("")}</div>`)}

${S("rsvp",H("Confirmer ma présence","Nous comptons sur vous")+
 `<p class="rv">Un seul formulaire pour nous dire si vous serez des nôtres.</p>
  <a class="btn rv" target="_blank" rel="noopener" href="${N.rsvpUrl}">Confirmer ma présence</a>
  <small class="rv">${N.limite}</small>`)}

<footer>
  <p class="rv">${N.merci}</p>
  <p class="nb rv">${N.nb}</p>
  <div class="ini rv">${N.p1[0]} &amp; ${N.p2[0]}</div>
  <small class="rv">${N.hashtag}</small>
</footer>`;

const reduce=matchMedia("(prefers-reduced-motion:reduce)").matches;

/* Compte à rebours */
const cible=new Date(N.dateISO).getTime();
function tick(){
  const s=Math.max(0,Math.floor((cible-Date.now())/1000));
  [Math.floor(s/86400),Math.floor(s%86400/3600),Math.floor(s%3600/60),s%60]
    .forEach((v,i)=>$("#c"+i).textContent=i?String(v).padStart(2,"0"):v);
}
tick();setInterval(tick,1000);

/* Apparition au défilement */
function init(){
  const io=new IntersectionObserver((es,o)=>es.forEach(e=>{
    if(e.isIntersecting){e.target.classList.add("in");o.unobserve(e.target)}
  }),{threshold:.2,rootMargin:"0px 0px -8% 0px"});
  document.querySelectorAll(".rv,.t").forEach(el=>io.observe(el));
  upd();
}

/* Frise + profondeur de la galerie */
let tk=0;
function upd(){
  tk=0;const vh=innerHeight,tl=$(".tl");
  if(tl){const r=tl.getBoundingClientRect();
    tl.style.setProperty("--p",reduce?1:Math.min(1,Math.max(0,(vh*.75-r.top)/r.height)))}
  if(!reduce)document.querySelectorAll(".ph img").forEach(im=>{
    const r=im.parentNode.getBoundingClientRect(),d=(r.top+r.height/2-vh/2)/vh;
    im.style.transform=`translateY(${Math.max(-1,Math.min(1,d))*r.height*.11}px)`;
  });
}
addEventListener("scroll",()=>{tk||(tk=requestAnimationFrame(upd))},{passive:true});
addEventListener("resize",upd);

/* Ouverture de l'enveloppe */
$("#go").onclick=()=>{
  const o=$("#ouv");o.classList.add("open");
  setTimeout(()=>{
    scrollTo(0,0);document.body.classList.remove("lock");
    o.classList.add("end");init();
    setTimeout(()=>o.remove(),2200);
  },reduce?0:3300);
};
</script>
</body>
</html>
